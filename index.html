<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criptomaníacos - Aldea Isométrica Web3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.2);
            border: 2px solid #1f293d;
            border-radius: 12px;
            overflow: hidden;
            background: #111827;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 15px;
            pointer-events: none;
        }
        .badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #38bdf8;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="ui-overlay">
            <div class="badge">💎 CRIPTO: <span id="crypto-count">120</span></div>
            <div class="badge">⚡ ENERGÍA: <span id="energy-count">100%</span></div>
        </div>
        <canvas id="isometricCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('isometricCanvas');
        const ctx = canvas.getContext('2d');

        let cryptoTokens = 120;
        const cryptoDisplay = document.getElementById('crypto-count');

        // Configuración de la cuadrícula isométrica
        const TILE_WIDTH = 64;
        const TILE_HEIGHT = 32;
        const ORIGIN_X = canvas.width / 2;
        const ORIGIN_Y = 120;

        // Mapa de la aldea (0: pasto, 1: agua animada, 2: edificio central, 3: choza cripto, 4: árbol)
        const mapGrid = [
            [1, 1, 1, 0, 0, 0, 4],
            [1, 1, 0, 0, 2, 0, 0],
            [1, 0, 0, 0, 0, 0, 4],
            [0, 0, 3, 0, 0, 3, 0],
            [0, 0, 0, 0, 0, 0, 0],
            [4, 0, 0, 3, 0, 0, 4]
        ];

        // Aldeanos paseando
        let villagers = [
            { x: 2, y: 1, targetX: 4, targetY: 4, progress: 0, speed: 0.008 },
            { x: 4, y: 3, targetX: 1, targetY: 1, progress: 0, speed: 0.006 }
        ];

        // Recursos flotantes recolectables
        let floatingTokens = [
            { x: 3, y: 2, floatOffset: 0, collected: false }
        ];

        let animationFrame = 0;

        function isoToScreen(isoX, isoY) {
            const screenX = ORIGIN_X + (isoX - isoY) * (TILE_WIDTH / 2);
            const screenY = ORIGIN_Y + (isoX + isoY) * (TILE_HEIGHT / 2);
            return { x: screenX, y: screenY };
        }

        function drawTile(isoX, isoY, type) {
            const screen = isoToScreen(isoX, isoY);
            ctx.beginPath();
            ctx.moveTo(screen.x, screen.y);
            ctx.lineTo(screen.x + TILE_WIDTH / 2, screen.y + TILE_HEIGHT / 2);
            ctx.lineTo(screen.x, screen.y + TILE_HEIGHT);
            ctx.lineTo(screen.x - TILE_WIDTH / 2, screen.y + TILE_HEIGHT / 2);
            ctx.closePath();

            if (type === 1) {
                // Agua animada
                let wave = Math.sin(animationFrame * 0.05 + isoX + isoY) * 15;
                ctx.fillStyle = `rgb(14, 116, ${144 + Math.floor(wave)})`;
            } else {
                // Pasto estilizado con sutil patrón
                ctx.fillStyle = (isoX + isoY) % 2 === 0 ? '#10b981' : '#059669';
            }
            ctx.fill();
            ctx.strokeStyle = '#047857';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawBuilding(isoX, isoY, type) {
            const screen = isoToScreen(isoX, isoY);
            let height = type === 2 ? 50 : 35;
            let baseColor = type === 2 ? '#3b82f6' : '#8b5cf6';
            let roofColor = type === 2 ? '#1d4ed8' : '#6d28d9';

            // Paredes laterales
            ctx.fillStyle = baseColor;
            ctx.beginPath();
            ctx.moveTo(screen.x - TILE_WIDTH / 2, screen.y + TILE_HEIGHT / 2);
            ctx.lineTo(screen.x, screen.y + TILE_HEIGHT);
            ctx.lineTo(screen.x, screen.y + TILE_HEIGHT - height);
            ctx.lineTo(screen.x - TILE_WIDTH / 2, screen.y + TILE_HEIGHT / 2 - height);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = shadeColor(baseColor, -20);
            ctx.beginPath();
            ctx.moveTo(screen.x, screen.y + TILE_HEIGHT);
            ctx.lineTo(screen.x + TILE_WIDTH / 2, screen.y + TILE_HEIGHT / 2);
            ctx.lineTo(screen.x + TILE_WIDTH / 2, screen.y + TILE_HEIGHT / 2 - height);
            ctx.lineTo(screen.x, screen.y + TILE_HEIGHT - height);
            ctx.closePath();
            ctx.fill();

            // Techo isométrco
            ctx.fillStyle = roofColor;
            ctx.beginPath();
            ctx.moveTo(screen.x, screen.y - height);
            ctx.lineTo(screen.x + TILE_WIDTH / 2, screen.y + TILE_HEIGHT / 2 - height);
            ctx.lineTo(screen.x, screen.y + TILE_HEIGHT - height);
            ctx.lineTo(screen.x - TILE_WIDTH / 2, screen.y + TILE_HEIGHT / 2 - height);
            ctx.closePath();
            ctx.fill();
        }

        function drawTree(isoX, isoY) {
            const screen = isoToScreen(isoX, isoY);
            // Tronco
            ctx.fillStyle = '#78350f';
            ctx.fillRect(screen.x - 4, screen.y + 5, 8, 20);
            // Follaje
            ctx.fillStyle = '#047857';
            ctx.beginPath();
            ctx.arc(screen.x, screen.y - 10, 16, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawVillager(v) {
            let currentX = v.x + (v.targetX - v.x) * v.progress;
            let currentY = v.y + (v.targetY - v.y) * v.progress;
            const screen = isoToScreen(currentX, currentY);

            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(screen.x, screen.y + TILE_HEIGHT / 2, 8, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cuerpo del aldeano
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(screen.x, screen.y + 5, 6, 0, Math.PI * 2);
            ctx.fill();

            v.progress += v.speed;
            if (v.progress >= 1) {
                v.x = v.targetX;
                v.y = v.targetY;
                v.targetX = Math.floor(Math.random() * 6);
                v.targetY = Math.floor(Math.random() * 6);
                v.progress = 0;
            }
        }

        function drawFloatingToken(token) {
            if (token.collected) return;
            const screen = isoToScreen(token.x, token.y);
            token.floatOffset = Math.sin(animationFrame * 0.1) * 6;

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(screen.x, screen.y - 15 + token.floatOffset, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#bae6fd';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3),16);
            let G = parseInt(color.substring(3,5),16);
            let B = parseInt(color.substring(5,7),16);
            R = parseInt(R * (100 + percent) / 100);
            G = parseInt(G * (100 + percent) / 100);
            B = parseInt(B * (100 + percent) / 100);
            R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255;
            let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
            let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
            let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
            return "#"+RR+GG+BB;
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            floatingTokens.forEach(token => {
                if (!token.collected) {
                    const screen = isoToScreen(token.x, token.y);
                    const dist = Math.hypot(mouseX - screen.x, mouseY - (screen.y - 15));
                    if (dist < 20) {
                        token.collected = true;
                        cryptoTokens += 10;
                        cryptoDisplay.innerText = cryptoTokens;
                        setTimeout(() => {
                            token.x = Math.floor(Math.random() * 6);
                            token.y = Math.floor(Math.random() * 6);
                            token.collected = false;
                        }, 5000);
                    }
                }
            });
        });

        function gameLoop() {
            animationFrame++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar mapa en orden isométrico (pintar de atrás hacia adelante)
            for (let y = 0; y < mapGrid.length; y++) {
                for (let x = 0; x < mapGrid[y].length; x++) {
                    drawTile(x, y, mapGrid[y][x]);
                    if (mapGrid[y][x] === 4) {
                        drawTree(x, y);
                    } else if (mapGrid[y][x] > 1) {
                        drawBuilding(x, y, mapGrid[y][x]);
                    }
                }
            }

            // Dibujar elementos dinámicos
            villagers.forEach(drawVillager);
            floatingTokens.forEach(drawFloatingToken);

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
