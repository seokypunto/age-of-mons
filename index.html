<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Juego Web3 - Isometric</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            background-color: #0b132b;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .ui-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .resource-box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Interfaz superior de recursos -->
        <div class="ui-bar">
            <div class="resource-box">💎 CRIPTO: <span id="crypto-count">120</span></div>
            <div class="resource-box">🧪 ELIXIR: <span id="elixir-count">45</span></div>
            <div class="resource-box">🪵 MADERA: <span id="wood-count">2110</span></div>
        </div>

        <!-- Lienzo del juego -->
        <canvas id="gameCanvas" width="900" height="650"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 1. CARGA DE LA IMAGEN DEL ALDEANO DESDE GITHUB
        const villagerImg = new Image();
        villagerImg.src = 'public/images/villager.png';
        
        let imageLoaded = false;
        villagerImg.onload = function() {
            imageLoaded = true;
        };
        villagerImg.onerror = function() {
            villagerImg.src = 'images/villager.png';
        };

        // Configuración del mapa isométrico
        const mapWidth = 10;
        const mapHeight = 10;
        const tileWidth = 64;
        const tileHeight = 32;

        // Aldeanos en el mapa
        const villagers = [
            { x: 3, y: 3 },
            { x: 6, y: 4 },
            { x: 2, y: 7 }
        ];

        function isoToScreen(isoX, isoY) {
            const screenX = canvas.width / 2 + (isoX - isoY) * (tileWidth / 2);
            const screenY = 150 + (isoX + isoY) * (tileHeight / 2);
            return { x: screenX, y: screenY };
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar el suelo isométrico (Casillas)
            for (let x = 0; x < mapWidth; x++) {
                for (let y = 0; y < mapHeight; y++) {
                    const screen = isoToScreen(x, y);

                    ctx.beginPath();
                    ctx.moveTo(screen.x, screen.y);
                    ctx.lineTo(screen.x + tileWidth / 2, screen.y + tileHeight / 2);
                    ctx.lineTo(screen.x, screen.y + tileHeight);
                    ctx.lineTo(screen.x - tileWidth / 2, screen.y + tileHeight / 2);
                    ctx.closePath();

                    ctx.fillStyle = (x + y) % 2 === 0 ? '#10b981' : '#059669';
                    ctx.fill();
                    ctx.strokeStyle = '#047857';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            // 2. Dibujar árboles en el mapa
            const treePositions = [{x: 3, y: 2}, {x: 6, y: 2}, {x: 2, y: 5}, {x: 7, y: 7}];
            treePositions.forEach(t => {
                const treePos = isoToScreen(t.x, t.y);
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(treePos.x - 6, treePos.y - 10, 12, 20);
                ctx.fillStyle = '#065f46';
                ctx.beginPath();
                ctx.arc(treePos.x, treePos.y - 15, 16, 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Dibujar los aldeanos usando tu imagen de cel-shading
            villagers.forEach(v => {
                const pos = isoToScreen(v.x, v.y);

                if (imageLoaded) {
                    // Dibuja tu sprite centrado en la baldosa isométrica
                    ctx.drawImage(villagerImg, pos.x - 24, pos.y - 40, 48, 48);
                } else {
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
