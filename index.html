<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Juego Web3</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #2b2b2b;
            border: 2px solid #555;
        }
    </style>
</head>
<body>

    <!-- Zona donde se dibuja el juego -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Creamos el objeto de la imagen
        const villager = new Image();
        
        // Ruta de la imagen que subiste a GitHub
        villager.src = 'public/images/villager.png';

        // Cuando la imagen termine de cargar en el navegador, la dibujamos en el canvas
        villager.onload = function() {
            // Dibuja la imagen en la coordenada X: 100, Y: 100, con un ancho y alto de 64x64 píxeles
            ctx.drawImage(villager, 100, 100, 64, 64);
            console.log("¡Aldeano dibujado correctamente en pantalla!");
        };

        // Si hubiera algún error cargando la ruta, te avisará en la consola del navegador (F12)
        villager.onerror = function() {
            console.error("No se pudo cargar la imagen del aldeano. Revisa que la ruta 'public/images/villager.png' sea correcta.");
        };
    </script>

</body>
</html>
