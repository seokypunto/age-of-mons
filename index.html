<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age of Mons - Motor de Producción</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; overflow: hidden; background-color: #080d14; color: #e6edf3; }
        #gameCanvas { cursor: grab; touch-action: none; }
        #gameCanvas:active { cursor: grabbing; }
        .glass-panel { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-panel-gold { background: rgba(24, 20, 10, 0.92); border: 1px solid rgba(234, 179, 8, 0.35); box-shadow: 0 0 25px rgba(234, 179, 8, 0.12); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-45px) scale(1.2); } }
        .float-text { animation: floatUp 1.2s ease-out forwards; position: absolute; pointer-events: none; font-weight: 800; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative overflow-hidden bg-slate-950 text-slate-100">

    <!-- HUD -->
    <header class="h-16 glass-panel border-b border-slate-800 px-4 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20">
                <i data-lucide="castle" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-base tracking-wide bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-500 bg-clip-text text-transparent leading-none">AGE OF MONS</h1>
                <span class="text-[10px] text-amber-400/80 font-semibold uppercase tracking-widest">Economía Activa</span>
            </div>
        </div>

        <div class="flex items-center gap-5 bg-slate-900/90 px-5 py-2 rounded-xl border border-slate-800">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400"><i data-lucide="coins" class="w-4 h-4"></i></div>
                <div class="flex flex-col">
                    <span class="text-[9px] uppercase font-extrabold text-slate-400">ORO</span>
                    <span id="goldCount" class="text-sm font-extrabold text-amber-300 leading-none">1,000</span>
                </div>
            </div>
            <div class="h-6 w-px bg-slate-800"></div>
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-amber-700/20 border border-amber-700/40 flex items-center justify-center text-amber-600"><i data-lucide="trees" class="w-4 h-4"></i></div>
                <div class="flex flex-col">
                    <span class="text-[9px] uppercase font-extrabold text-slate-400">MADERA</span>
                    <span id="woodCount" class="text-sm font-extrabold text-amber-500 leading-none">1,000</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="toggleGridBtn" class="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-300"><i data-lucide="grid" class="w-4 h-4"></i></button>
            <button class="p-2.5 rounded-xl bg-emerald-950/60 border border-emerald-700/50 text-emerald-400 flex items-center gap-2"><i data-lucide="database" class="w-4 h-4"></i><span class="text-xs font-bold hidden sm:inline">Supabase OK</span></button>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <div class="flex-1 relative flex overflow-hidden">
        <aside class="absolute top-4 left-4 z-10 flex flex-col gap-2">
            <button id="toolSelect" class="tool-btn active w-12 h-12 rounded-xl glass-panel flex flex-col items-center justify-center text-amber-400 border-amber-500 border-2"><i data-lucide="mouse-pointer" class="w-5 h-5"></i><span class="text-[9px] font-bold">Ver</span></button>
            <button id="toolBuild" class="tool-btn w-12 h-12 rounded-xl glass-panel flex flex-col items-center justify-center text-slate-300 border-slate-800"><i data-lucide="hammer" class="w-5 h-5"></i><span class="text-[9px] font-bold">Construir</span></button>
            <button id="toolDemolish" class="tool-btn w-12 h-12 rounded-xl glass-panel flex flex-col items-center justify-center text-red-400 border-slate-800"><i data-lucide="trash-2" class="w-5 h-5"></i><span class="text-[9px] font-bold">Demoler</span></button>
        </aside>

        <main class="w-full h-full relative overflow-hidden bg-slate-950">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>
            <div id="floatingTextContainer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
        </main>

        <!-- MENÚ CONSTRUCCIÓN -->
        <div id="buildMenuDrawer" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-20 glass-panel-gold rounded-2xl p-4 w-[92%] max-w-3xl shadow-2xl">
            <div class="flex items-center justify-between mb-3 border-b border-amber-500/20 pb-2">
                <h3 class="font-extrabold text-sm text-slate-100 uppercase">Catálogo de Edificios</h3>
                <button id="closeBuildMenu" class="text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="buildingCardsList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 max-h-60 overflow-y-auto p-1"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dmzneqpvcxvvsbiuvsuv.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'sb_publishable_KPDyDLQ-UNHrqYEgnpZUjw_1VcvWFfk';
        const supabaseClient = supabase.createClient('https://dmzneqpvcxvvsbiuvsuv.supabase.co', SUPABASE_KEY);

        let playerData = { gold: 1000, wood: 1000 };

        const GRID_SIZE = 30;
        const TILE_WIDTH = 64;
        const TILE_HEIGHT = 32;

        const BUILDING_CATALOG = [
            { id: 'townhall', name: 'Ayuntamiento', width: 4, height: 4, color: '#d97706', roofColor: '#b45309', cost: 0, production: null, icon: 'castle' },
            { id: 'goldmine', name: 'Mina de Oro', width: 3, height: 3, color: '#eab308', roofColor: '#ca8a04', cost: 200, production: { type: 'gold', amount: 25 }, icon: 'coins' },
            { id: 'lumberjack', name: 'Aserradero', width: 3, height: 3, color: '#b45309', roofColor: '#78350f', cost: 200, production: { type: 'wood', amount: 25 }, icon: 'trees' },
            { id: 'cannon', name: 'Cañón', width: 2, height: 2, color: '#475569', roofColor: '#334155', cost: 150, production: null, icon: 'crosshair' },
            { id: 'wall', name: 'Muro', width: 1, height: 1, color: '#64748b', roofColor: '#475569', cost: 30, production: null, icon: 'square' }
        ];

        const TERRAIN = { GRASS: 0, WATER: 1, FOREST: 2, ROCK: 3, BORDER: 4 };

        const state = {
            camera: { x: 0, y: 0, zoom: 1 },
            isPanning: false, panStart: { x: 0, y: 0 },
            showGrid: true, activeTool: 'select',
            selectedBuildingType: null, hoveredTile: { r: -1, c: -1 },
            map: [], buildings: []
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function initTerrainMap() {
            state.map = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(TERRAIN.GRASS));
            for(let r = 0; r < GRID_SIZE; r++) {
                for(let c = 0; c < GRID_SIZE; c++) {
                    if(r < 2 || r >= GRID_SIZE - 2 || c < 2 || c >= GRID_SIZE - 2) state.map[r][c] = TERRAIN.BORDER;
                }
            }
            const center = Math.floor(GRID_SIZE / 2) - 2;
            placeBuilding('townhall', center, center);
            placeBuilding('goldmine', center - 4, center);
            placeBuilding('lumberjack', center, center - 4);
        }

        function placeBuilding(typeId, r, c) {
            const bDef = BUILDING_CATALOG.find(b => b.id === typeId);
            if(!bDef) return null;
            const instance = { id: 'b_' + Date.now(), buildingId: typeId, r, c, w: bDef.width, h: bDef.height };
            state.buildings.push(instance);
            return instance;
        }

        function gridToIso(r, c) {
            return { x: (c - r) * (TILE_WIDTH / 2), y: (c + r) * (TILE_HEIGHT / 2) };
        }

        function isoToGrid(x, y) {
            const c = (x / (TILE_WIDTH / 2) + y / (TILE_HEIGHT / 2)) / 2;
            const r = (y / (TILE_HEIGHT / 2) - x / (TILE_WIDTH / 2)) / 2;
            return { r: Math.floor(r), c: Math.floor(c) };
        }

        function updateHUD() {
            document.getElementById('goldCount').innerText = Number(playerData.gold).toLocaleString();
            document.getElementById('woodCount').innerText = Number(playerData.wood).toLocaleString();
        }

        // BUCLE DE PRODUCCIÓN AUTOMÁTICA (CADA 5 SEGUNDOS)
        setInterval(() => {
            state.buildings.forEach(b => {
                const bDef = BUILDING_CATALOG.find(cat => cat.id === b.buildingId);
                if (bDef && bDef.production) {
                    playerData[bDef.production.type] += bDef.production.amount;
                    
                    // Mostrar texto flotante sobre el edificio
                    const iso = gridToIso(b.r, b.c);
                    const screenX = iso.x * state.camera.zoom + state.camera.x + canvas.width / 2; // aproximado
                    const screenY = iso.y * state.camera.zoom + state.camera.y + canvas.height / 3;
                    showFloatText(`+${bDef.production.amount} ${bDef.production.type === 'gold' ? 'Oro' : 'Madera'}`, screenX, screenY, bDef.production.type === 'gold' ? '#f59e0b' : '#d97706');
                }
            });
            updateHUD();
        }, 5000);

        function showFloatText(text, x, y, color) {
            const el = document.createElement('div');
            el.className = 'float-text text-xs';
            el.style.left = `${Math.random() * window.innerWidth * 0.6 + 200}px`;
            el.style.top = `${Math.random() * window.innerHeight * 0.4 + 150}px`;
            el.style.color = color;
            el.innerText = text;
            document.getElementById('floatingTextContainer').appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(state.camera.x, state.camera.y);
            ctx.scale(state.camera.zoom, state.camera.zoom);

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const { x, y } = gridToIso(r, c);
                    const alt = (r + c) % 2 === 0;
                    ctx.fillStyle = state.map[r][c] === TERRAIN.BORDER ? (alt ? '#450a0a' : '#7f1d1d') : (alt ? '#15803d' : '#16a34a');
                    ctx.beginPath();
                    ctx.moveTo(x, y); ctx.lineTo(x + TILE_WIDTH / 2, y + TILE_HEIGHT / 2);
                    ctx.lineTo(x, y + TILE_HEIGHT); ctx.lineTo(x - TILE_WIDTH / 2, y + TILE_HEIGHT / 2);
                    ctx.closePath(); ctx.fill();
                    if (state.showGrid) { ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)'; ctx.stroke(); }
                }
            }

            const sorted = [...state.buildings].sort((a, b) => (a.r + a.c) - (b.r + b.c));
            for (const b of sorted) {
                const bDef = BUILDING_CATALOG.find(cat => cat.id === b.buildingId);
                if (!bDef) continue;
                const isoTop = gridToIso(b.r, b.c);
                const isoRight = gridToIso(b.r, b.c + b.w);
                const isoBottom = gridToIso(b.r + b.h, b.c + b.w);
                const isoLeft = gridToIso(b.r + b.h, b.c);
                const h3D = b.w * 16 + 12;

                ctx.fillStyle = bDef.roofColor;
                ctx.beginPath();
                ctx.moveTo(isoTop.x, isoTop.y - h3D); ctx.lineTo(isoRight.x, isoRight.y - h3D);
                ctx.lineTo(isoBottom.x, isoBottom.y - h3D); ctx.lineTo(isoLeft.x, isoLeft.y - h3D);
                ctx.closePath(); ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)'; ctx.stroke();
            }
            ctx.restore();
        }

        // Controles de cámara y eventos básicos
        canvas.addEventListener('mousedown', e => { if(e.button === 0){ state.isPanning = true; state.panStart = { x: e.clientX - state.camera.x, y: e.clientY - state.camera.y }; } });
        window.addEventListener('mousemove', e => { if(state.isPanning){ state.camera.x = e.clientX - state.panStart.x; state.camera.y = e.clientY - state.panStart.y; render(); } });
        window.addEventListener('mouseup', () => state.isPanning = false);
        canvas.addEventListener('wheel', e => { e.preventDefault(); state.camera.zoom = Math.min(Math.max(state.camera.zoom * (e.deltaY < 0 ? 1.1 : 0.9), 0.5), 2.5); render(); }, { passive: false });

        document.getElementById('toggleGridBtn').onclick = () => { state.showGrid = !state.showGrid; render(); };

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; render(); }
        function centerCam() {
            const iso = gridToIso(GRID_SIZE/2, GRID_SIZE/2);
            state.camera.x = canvas.width / 2 - iso.x;
            state.camera.y = canvas.height / 3 - iso.y;
            render();
        }

        initTerrainMap();
        window.onload = () => { lucide.createIcons(); resizeCanvas(); centerCam(); updateHUD(); };
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
