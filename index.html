<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Juego Web3</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #2b2b2b;
            border: 2px solid #555;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const villager = new Image();
        villager.src = 'https://github.com/seokypunto/age-of-mons/blob/main/public/images/villager.png?raw=true';

        villager.onload = function () {
            ctx.drawImage(villager, 100, 100, 64, 64);
            console.log('¡Aldeano dibujado correctamente en pantalla!');
        };

        villager.onerror = function () {
            console.error('No se pudo cargar la imagen del aldeano desde la URL de GitHub.');
        };
    </script>

</body>
</html>
